<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fintracker</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Fintracker</h1>
      <p class="subtitle">Your personal expense tracker</p>
    </header>

    <!-- Storage error banner (FR-012) -->
    <div id="storage-error" role="alert" hidden>
      <p>Unable to save — storage unavailable. Please free up browser storage and try again.</p>
      <button id="storage-error-dismiss">Dismiss</button>
    </div>

    <!-- Form section (US1) -->
    <section id="form-section">
      <h2>Add Expense</h2>
      <form id="expense-form" novalidate>
        <div class="form-group">
          <label for="expense-name">Expense name</label>
          <input
            type="text"
            id="expense-name"
            name="expense-name"
            placeholder="e.g. Lunch"
            maxlength="100"
            autocomplete="off"
          >
          <span class="error" id="name-error" aria-live="polite"></span>
        </div>
        <div class="form-group">
          <label for="expense-amount">Amount ($)</label>
          <input
            type="number"
            id="expense-amount"
            name="expense-amount"
            placeholder="0.00"
            min="0.01"
            step="0.01"
          >
          <span class="error" id="amount-error" aria-live="polite"></span>
        </div>
        <div class="form-group">
          <label for="expense-category">Category</label>
          <select id="expense-category" name="expense-category">
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Health">Health</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <button type="submit" id="submit-btn">Add Expense</button>
      </form>
    </section>

    <!-- Summary section (US3) -->
    <section id="summary-section">
      <h2>Spending by Category</h2>
      <ul id="category-summary" aria-label="Category spending summary"></ul>
      <p id="summary-empty">No data yet.</p>
    </section>

    <!-- Expense list section (US2) -->
    <section id="list-section">
      <h2>Expenses</h2>
      <ul id="expense-list" aria-label="Expense list"></ul>
      <p id="empty-state">No expenses yet. Add your first one above.</p>
    </section>
  </div>

  <!-- Toast notification (US4) -->
  <div id="toast-container">
    <div id="toast" role="status" aria-live="polite" hidden>
      <span id="toast-message"></span>
      <button id="toast-action" hidden></button>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
